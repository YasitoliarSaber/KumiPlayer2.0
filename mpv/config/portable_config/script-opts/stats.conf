# KumiPlayer 受控 stats 配置（中文翻译版）
#
# 来源：yosh-wang/mpv-stats.lua-zh-chinese-translation-（main 分支，2026-07-12）
# 机制：基于 mpv 官方 v0.41.0 内置 stats.lua（源自 Argon-/mpv-stats），
#       附加中文全局替换翻译模块与 Windows CPU/GPU 占用率统计模块。
# 键位：TAB 切换统计页面（input.conf 显式绑定 stats/display-stats-toggle）。
#       注意：已禁用 mpv 内置键位（input-builtin-bindings=no），默认的 i/I
#       不再生效，统一以 input.conf 的显式绑定为准。
#
# 官方 stats 脚本的全部选项（键位、样式、图形等）均通过本文件配置，
# 中文版未新增额外选项（唯一新增 track_info_selected_only 已在脚本内默认开启）。
# 参考：https://github.com/yosh-wang/mpv-stats.lua-zh-chinese-translation-
#
# 以下为官方默认值，KumiPlayer 暂不覆盖，仅作记录：
# duration=4
# redraw_delay=1
# ass_formatting=yes
# persistent_overlay=no
# plot_perfdata=no
# plot_cache=yes
# font_size=20
# alpha=11
