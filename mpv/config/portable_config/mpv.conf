# KumiPlayer MPV 自带配置源（mpv-runtime）
#
# 本目录由 KumiPlayer 自维护，是内置 MPV 的最小配置骨架，不是第三方整合包。
# 播放链路通过 --config-dir 显式加载本目录，由 KumiPlayer 管理的配置不会
# 继承旧整合包或用户全局 MPV 配置。
#
# 已接入的运行时能力（均由项目自有脚本和官方资料追溯）：
#   - uosc 播放界面、thumbfast 缩略图与 Anime4K 着色器；
#   - 中文化 stats 统计页面（scripts/stats.lua）；
#   - 安全的硬件解码自动选择；
#   - 完全自定义键位（input-builtin-bindings=no，见 input.conf）；
#   - 不读取用户全局 MPV 配置。
#
# 功能插件由本 portable_config 的 scripts/ 目录自动加载，不需要通过
# --scripts-append 重复注入。
# 修改本目录任何配置前，必须阅读：
#   mpv/docs/MPV运行时演进记录.md
#   mpv/README.md
#
# 参考：https://mpv.io/manual/stable/


border=no
window-dragging=yes
window-corners=round

# Windows 设备优先使用 MPV 白名单内的硬件解码；不可用时自动回退软件解码。
hwdec=auto-safe

# 统计信息页使用 KumiPlayer 中文化的 stats.lua（scripts/stats.lua）。
# load-stats-overlay=no 禁用 mpv 内置英文 stats 脚本，避免同名脚本被
# 自动重命名为 stats2 造成重复页面与键位冲突（MPV 官方手册 --load-stats-overlay）。
load-stats-overlay=no

# 禁用 mpv 二进制内置键位（方向键/空格/音量键等硬编码绑定），全部快捷键
# 由 KumiPlayer 在 input.conf 显式定义，与旧版整合包方案一致
# （MPV 官方手册 --input-builtin-bindings；注意不要用 --no-input-default-bindings，
#  它会连脚本弱绑定一起屏蔽，导致 stats/console 脚本键位失效）。
input-builtin-bindings=no

# 禁用 mpv 原生 OSD 进度条：滚轮/方向键调节进度时不再弹出粗进度条，
# 进度反馈由 uosc 时间轴（timeline）提供（MPV 官方手册 --osd-bar / --osd-on-seek）。
osd-bar=no
osd-on-seek=no

# ── 字幕：动漫外挂字幕的自动挂载与语言优先级 ──────────────────────
# 与视频同名的外挂字幕常带发布组与语言后缀（-01v2、[组名]、.CHS.Ass 等），
# mpv 默认 sub-auto=exact 只认完全同名文件，会漏挂字幕
# （MPV 官方手册 --sub-auto，可选 no|exact|fuzzy|all）。
sub-auto=fuzzy

# 字幕语言优先级（MPV 官方手册 --slang，ISO 639 语言代码列表）。
#
# 只列**中文字幕的各种命名习惯**，末尾留 en 兜底：
#   sc/tc（简/繁，常见于 VCB 等组）、chs/cht、zh-cn/zh-hans/zh-hant/zh-tw/zh-hk。
#
# ⚠️ 绝对不要把日语（ja/jp）写进来，也不要写音轨语言。
# 实测（1080p 动画、日语音轨、外挂 .sc.ass/.tc.ass、无日语字幕）：
#   slang=sc,chs,zh-cn,zh-hans,tc,cht                     -> 选中 1 条 ✔
#   slang=ja  /  含 ja 的任意列表                          -> 选中 0 条 ✘（sid=no，一个字幕都不显示）
#   slang=en（无英语字幕）                                  -> 选中 1 条 ✔
# 也就是说：slang 一旦命中"音轨语言"而字幕里又没有该语言，mpv 会直接不选任何字幕。
# 这曾经导致"字幕不能正常自动读取"，故此处只保留中文字幕语言 + en。
slang=zh,zh-cn,zh-hans,zh-hant,zh-tw,zh-hk,sc,tc,chs,cht,en

# mpv 默认 yes：音轨语言与字幕语言匹配时自动关闭字幕。KumiPlayer 的动画素材
# 常同时存在中配/原声双轨，该默认会表现为“字幕莫名不显示”，故明确保持字幕可见
# （MPV 官方手册 --subs-with-matching-audio，可选 no|forced|yes）。
subs-with-matching-audio=no

# ── 网盘/挂载盘读缓冲：对齐 MPVlite 整合包取值 ──────────────────────
# KumiPlayer 的主要素材在网盘挂载盘（K:\ 等）上。这类路径在 mpv 看来是**本地文件**，
# 而 mpv 默认的 cache=auto 只为"流"启用缓存 → 挂载盘素材实际上**没有预读**，
# 每次寻道/跳转都要同步等一次网络往返，表现就是"操作起来卡卡的"（拖进度条、
# 后退几秒、切下一集都要顿一下）。整合包对这类场景的取值就是下面这一组，
# 每一项都是 mpv 官方选项：
cache=yes                      # --cache：强制启用读缓冲（不再只对"流"生效）
demuxer-readahead-secs=5       # --demuxer-readahead-secs：预读 5 秒（默认 1）
demuxer-max-bytes=1000MiB      # --demuxer-max-bytes：前向缓冲上限（默认 150MiB）
demuxer-max-back-bytes=100MiB  # --demuxer-max-back-bytes：后向缓冲（默认 50MiB）
#
# 其中后向缓冲是"往回拖不用重新走网络"的关键，前向放大则保证连续读盘不被打断。
#
# 说明（更正 2026-09-21 的判断）：当时用 1080p **合成素材**测出"0 丢帧、cache=yes
# 无收益"就把它回退了——但那个测例是本地/合成素材，字节上限根本不会触发，
# 因此测不出挂载盘的收益。对高延迟挂载盘，缓冲字节数正是"能否离线重放"的
# 决定因素，所以这里按整合包取值采用。
# ⚠️ 本轮作业时 K:\ 未挂载，**无法在真实挂载盘上实测**，故直接采用整合包同款取值；
# 若真机上仍有顿感，优先调 demuxer-readahead-secs 与 demuxer-max-back-bytes。
#
# 参考：MPV 官方手册 --cache / --demuxer-readahead-secs / --demuxer-max-bytes /
# --demuxer-max-back-bytes。

# ── 窗口缩放：不强制吸附视频宽高比 ─────────────────────────────────
# 默认 keepaspect-window=yes 会在缩放窗口时把尺寸吸附到视频宽高比；无边框窗口
# （border=no）拖拽边缘缩放时会有"一格一格跳"的顿感。设为 no 后可自由缩放，
# 多余区域按背景色填充（整合包同样取值）。
# 参考：MPV 官方手册 --keepaspect-window。
keepaspect-window=no
