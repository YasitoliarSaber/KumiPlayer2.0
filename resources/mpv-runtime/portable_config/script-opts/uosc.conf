# KumiPlayer 受控 uosc 配置（uosc 5.13.0）
#
# 原则：
# - 保留 uosc 的现代 OSD/时间轴/右键菜单视觉能力；
# - 屏蔽绕过 KumiPlayer 后端的入口：本配置不做输入绑定，KumiPlayer 的
#   input.conf 不绑定 uosc/open-file、uosc/update、uosc/playlist 等命令；
# - 播放列表自动填充与乱序默认关闭（与 --autocreate-playlist=no 对齐）；
# - 状态与缓存仍由 KumiPlayer 状态目录管理。

# 界面与时间轴：条形进度在窗口和全屏下都保持清晰可见。
timeline_style=bar
timeline_size=18
timeline_line_width=2
timeline_border=1
timeline_step=1
timeline_cache=yes
timeline_heatmap=overlay
timeline_persistency=
progress=always
progress_size=3
progress_line_width=20
opacity=timeline=1,position=1,chapters=0.9,thumbnail=1

# 章节范围（片头/片尾着色）：uosc 会按章节名把片头/片尾区间标在时间线上。
# 内置已识别英文写法（OP/ED/Opening/Ending，见 lib/utils.lua 的
# serialize_chapter_ranges），这里补充默认的日文写法并追加中文写法，
# 覆盖简繁字幕组的中文章节名。语法：`{类型}:{模式}[,{模式N}][;{类型}:...]`
chapter_range_patterns=openings:オープニング,片头,片头曲;endings:エンディング,片尾,片尾曲

# 控制条：保留播放控制/字幕/音轨/速度/全屏，去掉危险项
# 弹幕控件使用旧版显式格式，兼容所有 uosc 版本
controls=menu,gap,play-pause,gap,subtitles,command:search:script-message open_search_danmaku_menu?弹幕搜索,cycle:toggle_on:show_danmaku@uosc_danmaku:on=toggle_on/off=toggle_off?弹幕,command:palette:script-message open_danmaku_style_menu?弹幕样式,gap,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,gap,space,speed,gap,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
controls_persistency=idle

# 暂停指示器：uosc 默认（flash）会在每次暂停/恢复时于画面中央闪现一个大号
# 播放/暂停图标。KumiPlayer 的播放反馈由 uosc 时间轴与控制条提供，中央大图标
# 属于重复信息且遮挡画面，故关闭（uosc 选项 pause_indicator=no）。
pause_indicator=no

# 顶栏
top_bar=no-border
top_bar_size=40
top_bar_title=yes
top_bar_flash_on=video,audio

# 音量
volume=right
volume_size=40
volume_border=1
volume_step=1
volume_persistency=idle

# 菜单
menu_item_height=36
menu_min_width=260
menu_padding=4
menu_type_to_search=yes

# 播放列表策略：不自动加载外部播放列表/文件（受控队列在 KumiPlayer 后端）
autoload=no
shuffle=no
playlist_types=url

# 缩放与字体
# scale=1 是窗口模式时间线/控件命中区的基础系数；scale=0 会把窗口模式
# 的时间线尺寸与鼠标命中区都乘成 0（全屏走 scale_fullscreen），导致底部
# 进度条不可见且无法拖动。languages 让 uosc 原生菜单（字幕/音轨/章节等）
# 使用简体中文，KumiPlayer 的 Anime4K 菜单文案由自身脚本控制。
scale=1
scale_fullscreen=1
languages=zh-hans,en
font_scale=1
font_bold=no
text_border=1.2
border_radius=4

# 窗口边框：无边框窗口（border=no）下 uosc 会沿窗口内缘画一圈 1px 边框
# （elements/WindowBorder.lua，颜色取 color.window_border，默认纯黑，
#  opacity 取 opacity.border），叠在画面上就是一圈"框"。
# KumiPlayer 要求画面干净，故关闭：0 表示不绘制（decide_enabled 直接返回 false）。
window_border_size=0

# 动效
animation_duration=100
flash_duration=1000
