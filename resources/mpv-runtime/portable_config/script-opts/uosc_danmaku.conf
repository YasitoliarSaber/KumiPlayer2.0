# KumiPlayer 弹幕服务配置
#
# 弹幕功能开箱即用，无需额外配置。
# 默认经 uosc_danmaku 官方代理访问弹弹 Play，播放时按 Ctrl+d 搜索弹幕即可。
#
# ====================================================================

# ── 弹幕 API 服务器地址 ──────────────────────────────────────────
# 使用 uosc_danmaku 官方维护的代理（danmaku-api.152468.xyz）：
# 弹弹 Play 直连 api.dandanplay.net 已返回 403（官方密钥作废 + 分层额度），
# 必须经代理访问（详见 uosc_danmaku 仓库 Issue #397）。
#
# 进阶：如需更多弹幕来源（爱优腾芒等），可自行部署 danmu_api
# 部署后将下方地址改为你的 danmu_api 地址，例如：
#   api_server=http://127.0.0.1:9321
# 部署指南见：docs/弹幕进阶部署指南.md
api_server=https://danmaku-api.152468.xyz

# ── 兜底弹幕服务器（非动画弹幕：B站/爱优腾等）──────────────────
# 官方默认 api.danmu.icu 已下线（域名易主），改用 uosc_danmaku 官方 README
# 列出的可用服务器 dmku.hls.one（实测可返回真实弹幕）。
fallback_server=https://dmku.hls.one

# ── 弹幕加载行为 ──────────────────────────────────────────────────
# 播放时自动加载上次匹配的弹幕（同目录其他集也会自动加载）
auto_load=yes
# 自动加载同目录下同名的 xml 格式弹幕文件
autoload_local_danmaku=no
# 网络 URL 播放时自动加载弹幕（bilibili、巴哈姆特）
autoload_for_url=no
# 播放结束时自动保存弹幕到本地（xml 格式）
save_danmaku=no

# ── 弹幕显示样式 ──────────────────────────────────────────────────
# 透明度：0（完全透明）到 1（不透明）
opacity=0.7
# 滚动弹幕显示时间（秒）
scrolltime=15
# 固定弹幕显示时间（秒）
fixtime=5
# 字体
fontname=sans-serif
# 字体大小
fontsize=50
# 字体阴影
shadow=0
# 粗体
bold=yes
# 显示范围 0.0-1.0
displayarea=0.85
# 描边 0-4
outline=1.0
# 中文简繁转换：0-不转换，1-转简体，2-转繁体
chConvert=0
# 屏幕同时显示的最大弹幕数量（0=不限制）
max_screen_danmaku=0

# ── 弹幕处理 ──────────────────────────────────────────────────────
# 合并重复弹幕的容差时间（秒），-1=禁用，0=合并同时间相同弹幕
merge_tolerance=-1
# 合并时是否忽略类型和颜色差异
merge_without_style=no

# ── 快捷键 ────────────────────────────────────────────────────────
# 搜索弹幕
open_search_danmaku_menu_key=Ctrl+d
# 弹幕开关
show_danmaku_keyboard_key=Alt+d
