# KumiPlayer 受控 thumbfast 配置（commit 0f711de）
#
# - 缓存目录固定在 KumiPlayer 状态目录 data/mpv-state/thumbfast/（由后端注入）；
# - network=no：网络/远程 .strm 目标不尝试生成缩略图，UI 降级为无预览；
# - audio=no：音频不生成缩略图；
# - 限制最大宽高，避免时间轴预览占用过大显存或磁盘。

# 缩略图缓存目录（KumiPlayer 后端通过 --script-opts=thumbfast.thumbnail=... 注入实际路径）
thumbnail=

# 最大尺寸
max_width=320
max_height=320

# 二次缩放系数（默认 1；此处保持 1 以避免额外处理）
scale_factor=1

# 网络与音频默认关闭
network=no
audio=no

# 缩略图硬解（仅有限解码 API 可用；失败自动回退软解）
hwdec=yes

# 文件加载后不立即启动后端（由交互触发，降低资源占用）
spawn_first=no

# 空闲后端进程超时退出（秒，0=禁用）
quit_after_inactivity=0
