# KumiPlayer MPV 自带配置源（mpv-runtime）
#
# 本目录由 KumiPlayer 自维护，是内置 MPV 的最小配置骨架，不是第三方整合包。
# 播放链路通过 --config-dir 显式加载本目录，由 KumiPlayer 管理的配置不会
# 继承旧整合包或用户全局 MPV 配置。
#
# 已接入的运行时能力（均由项目自有脚本和官方资料追溯）：
#   - uosc 播放界面、thumbfast 缩略图与 Anime4K 着色器；
#   - 中文化 stats 统计页面（scripts/stats.lua）；
#   - 安全的硬件解码自动选择；
#   - 完全自定义键位（input-builtin-bindings=no，见 input.conf）；
#   - 不读取用户全局 MPV 配置。
#
# 功能插件由本 portable_config 的 scripts/ 目录自动加载，不需要通过
# --scripts-append 重复注入。
# 修改本目录任何配置前，必须阅读：
#   docs/03_运行时与发布/MPV/MPV运行时演进记录.md
#   third_party/mpv/README.md
#
# 参考：https://mpv.io/manual/stable/


border=no
window-dragging=yes
window-corners=round

# Windows 设备优先使用 MPV 白名单内的硬件解码；不可用时自动回退软件解码。
hwdec=auto-safe

# 统计信息页使用 KumiPlayer 中文化的 stats.lua（scripts/stats.lua）。
# load-stats-overlay=no 禁用 mpv 内置英文 stats 脚本，避免同名脚本被
# 自动重命名为 stats2 造成重复页面与键位冲突（MPV 官方手册 --load-stats-overlay）。
load-stats-overlay=no

# 禁用 mpv 二进制内置键位（方向键/空格/音量键等硬编码绑定），全部快捷键
# 由 KumiPlayer 在 input.conf 显式定义，与旧版整合包方案一致
# （MPV 官方手册 --input-builtin-bindings；注意不要用 --no-input-default-bindings，
#  它会连脚本弱绑定一起屏蔽，导致 stats/console 脚本键位失效）。
input-builtin-bindings=no

# 禁用 mpv 原生 OSD 进度条：滚轮/方向键调节进度时不再弹出粗进度条，
# 进度反馈由 uosc 时间轴（timeline）提供（MPV 官方手册 --osd-bar / --osd-on-seek）。
osd-bar=no
osd-on-seek=no

# ── 字幕：动漫外挂字幕的自动挂载与语言优先级 ──────────────────────
# 与视频同名的外挂字幕常带发布组与语言后缀（-01v2、[组名]、.CHS.Ass 等），
# mpv 默认 sub-auto=exact 只认完全同名文件，会漏挂字幕
# （MPV 官方手册 --sub-auto，可选 no|exact|fuzzy|all）。
sub-auto=fuzzy

# 字幕语言优先级：简体中文优先，其次繁体中文，再退日语/英语；
# 避免自动选中评论轨或纯日文字幕（MPV 官方手册 --slang）。
slang=sc,chs,zh-cn,zh-hans,tc,cht,zh-hant,zh-hk,zh-mo,zh-tw,jp,ja,en

# mpv 默认 yes：音轨语言与字幕语言匹配时自动关闭字幕。KumiPlayer 的动画素材
# 常同时存在中配/原声双轨，该默认会表现为“字幕莫名不显示”，故明确保持字幕可见
# （MPV 官方手册 --subs-with-matching-audio，可选 no|forced|yes）。
subs-with-matching-audio=no

# ── 网络流：网盘/OpenList 挂载盘的读缓冲（保持 mpv 默认）─────────────
# 这里**刻意不设 cache**，保持 mpv 默认的 cache=auto。
#
# 2026-09-21 曾加过 `cache=yes`，理由是网盘挂载盘（K:\ 等）在 mpv 看来是本地
# 文件、而 auto 不为本地文件启用缓存。但真机随后反馈播放卡顿，而针对性实测
# （1080p 素材 + Anime4K Mode C+A + hwdec=auto-safe，读取 mpv 的
# frame-drop-count / estimated-vf-fps）三种组合都是 0 丢帧、无差异，
# 无法证明 cache=yes 有收益，属于未经实测的猜测性改动，故回退。
#
# 若后续确认卡顿只发生在挂载盘素材上，应基于实测调整 cache / cache-secs /
# demuxer-readahead-secs，而不是凭猜测对全局开缓存。
#
# 参考：MPV 官方手册 --cache（auto 对网络流已启用缓存）、--cache-secs、
# --demuxer-readahead-secs、--demuxer-max-bytes。
