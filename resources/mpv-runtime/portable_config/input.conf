# KumiPlayer MPV 自带输入配置（input.conf）
#
# 文件职责：为 KumiPlayer 自维护 MPV 运行时定义按键配置。
# 播放链路通过 --config-dir 自动加载本文件，它是 KumiPlayer 内置 MPV 的
# 自有快捷键配置。未来设置页调整快捷键时，也应写入 KumiPlayer 自有配置，
# 不读取或改写用户全局 MPV 配置。
#
# 方案说明（2026-08-10 起）：
# - mpv.conf 已设 input-builtin-bindings=no：禁用 mpv 二进制内置键位
#   （方向键/空格/音量键等硬编码绑定），全部快捷键由本文件显式定义；
# - 不使用 --no-input-default-bindings：那会把脚本弱绑定（stats/console/
#   截图脚本的 mp.add_key_binding）一起屏蔽，导致脚本键位失效；
# - 脚本功能（stats/console/截图）在下方显式绑定，不依赖任何默认键位。
#
# 修改纪律：
#   1. 在 docs/03_运行时与发布/MPV/MPV运行时演进记录.md 记录新增/调整快捷键及目的；
#   2. 说明与 KumiPlayer Lua 脚本弱绑定的优先级关系；
#   3. 不引入会绕过后端受控队列的文件/列表加载类入口。
#
# 编码与格式约定：UTF-8 无 BOM、LF 换行；键位与命令之间用空格对齐，便于阅读。
# 参考：
# - https://mpv.io/manual/stable/#input-conf
# - https://hooke007.github.io/official_man/mpv.html（官方手册中文站）

# ── 安全屏蔽（绕过后端受控队列的风险键位）───────────────────────────
# mpv 默认绑定 Ctrl+v 会从剪贴板加载任意路径并追加到播放列表。
# KumiPlayer 的播放列表由后端构建（同季度受控队列），进度回写按路径映射；
# 剪贴板加载会绕过该队列且可能播放任意外部文件，故显式屏蔽（ignore 完全解绑）。

# ── KumiPlayer 项目自有绑定（已迁移至自有层 kumiplayer_bindings.lua）──
# MBTN_RIGHT 右键菜单 / TAB 统计 / ` 控制台 / F10、Alt+F10 截图 / Ctrl+v 安全屏蔽
# 由 resources/mpv-runtime/kumiplayer/scripts/kumiplayer_bindings.lua 弱绑定接管，
# 本文件不再重复声明（避免与自有层重复注册）。

# ── 脚本功能显式绑定（禁用内置键位后必须显式声明，否则失效）────────

# ── 播放控制（沿用旧整合包布局，用户确认 2026-08-11）────────────────
MBTN_LEFT            cycle pause                                      # 切换暂停（鼠标左键）
SPACE                cycle pause                                      # 切换暂停
ESC                  set fullscreen no                                # 退出全屏
DOWN                 add volume -1                                    # 音量 -1
UP                   add volume +1                                    # 音量 +1
WHEEL_DOWN           seek -3 exact                                    # 后退 3 秒（精确）
WHEEL_UP             seek 3 exact                                     # 前进 3 秒（精确）
LEFT                 seek -3                                          # 后退 3 秒（快速寻关键帧）
RIGHT                seek +3                                          # 前进 3 秒（快速寻关键帧）
MBTN_MID             cycle fullscreen                                 # 切换全屏（鼠标中键）
ALT+ENTER            cycle fullscreen                                 # 切换全屏
f                    cycle fullscreen                                 # 切换全屏
F11                  cycle fullscreen                                 # 切换全屏
ALT+MBTN_LEFT        script-binding positioning/drag-to-pan           # 移动画面
ALT+WHEEL_DOWN       script-binding positioning/cursor-centric-zoom -0.1   # 缩小画面
ALT+WHEEL_UP         script-binding positioning/cursor-centric-zoom +0.1   # 放大画面
SHIFT+LEFT           seek -3 exact                                    # 后退 3 秒（精确）
SHIFT+RIGHT          seek +3 exact                                    # 前进 3 秒（精确）
F1                   add sub-delay -0.1                               # 字幕延迟 -0.1 秒
F2                   add sub-delay +0.1                               # 字幕延迟 +0.1 秒
F3                   cycle sub down                                   # 上一个字幕轨道
F4                   cycle sub                                        # 下一个字幕轨道
F5                   add audio-delay -0.1                             # 音频延迟 -0.1 秒
F6                   add audio-delay +0.1                             # 音频延迟 +0.1 秒
F7                   cycle audio down                                 # 上一个音轨
F8                   cycle audio                                      # 下一个音轨
F12                  cycle sub-visibility                             # 字幕显示/隐藏
BS                   set speed 1                                      # 恢复 1 倍速

# ── 画质调节（mpv 内置属性，无需额外插件）───────────────────────────
1                    add contrast -1                                  # 对比度 -1
2                    add contrast +1                                  # 对比度 +1
3                    add brightness -1                                # 亮度 -1
4                    add brightness +1                                # 亮度 +1
5                    add gamma -1                                     # 伽马 -1
6                    add gamma +1                                     # 伽马 +1
7                    add saturation -1                                # 饱和度 -1
8                    add saturation +1                                # 饱和度 +1
9                    add hue -1                                       # 色相 -1
0                    add hue +1                                       # 色相 +1
