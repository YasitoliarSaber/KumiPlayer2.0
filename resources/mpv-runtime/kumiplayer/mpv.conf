# KumiPlayer 自有 MPV 强制配置（分层架构）
#
# 本文件属于 KumiPlayer 自有层（resources/mpv-runtime/kumiplayer/），
# 通过启动参数 --include 在整合包 mpv.conf 之后追加解析（MPV 官方手册：
# --include 在默认设置文件之后解析）。用户替换 portable_config 整合包后，
# 以下 KumiPlayer 强制配置仍然生效，保证应用功能不受影响。
#
# 参考：https://mpv.io/manual/stable/

# Windows 设备优先使用 MPV 白名单内的硬件解码；不可用时自动回退软件解码。
hwdec=auto-safe

# 统计信息页使用 KumiPlayer 中文化的 stats.lua。
# load-stats-overlay=no 禁用 mpv 内置英文 stats 脚本，避免同名脚本被
# 自动重命名为 stats2 造成重复页面与键位冲突（MPV 官方手册 --load-stats-overlay）。
load-stats-overlay=no

# 禁用 mpv 原生 OSD 进度条：滚轮/方向键调节进度时不再弹出粗进度条，
# 进度反馈由 uosc 时间轴（timeline）提供。放在自有层保证替换整合包后仍生效
# （MPV 官方手册 --osd-bar / --osd-on-seek）。
osd-bar=no
osd-on-seek=no
